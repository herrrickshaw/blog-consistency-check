[project]
name = "blog-consistency-check"
version = "0.1.0"
description = "Consistency / visual-regression checker for masaladeutsch.blogspot.com"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
rendered = ["playwright"]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["fixes", "out", "graphify-out", ".venv"]

[tool.ruff.lint]
select = ["E9", "F", "B", "W6"]
ignore = ["B007"]
